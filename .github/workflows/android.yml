# 每次 push / PR 自动跑三件事：
#   1. 文案守卫（tools/check_strings.py）：Kotlin 里不许再写中文界面文字
#   2. 单测（纯 JVM，不碰 Android API，112 条）
#   3. 打个调试包，确认资源 / 清单 / 混淆相关的东西没被改坏
#
# 电视上的实机验证不在 CI 里，按约定（周一到周五白天不做实机安装测试）
# 集中在晚上或周末跑，清单见 docs/待实机验证.md。
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一条分支连续 push 时取消上一次，别排队等十分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 文案守卫
  # 三十秒就能出结论，单独一个 job 先跑：文案回潮是最容易顺手犯的错，
  # 不想让人为了这一条等 Gradle 下载依赖。
  strings:
    name: 文案守卫
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 检查硬编码中文
        run: python3 tools/check_strings.py

      - name: 失败时列出每一处
        if: failure()
        run: python3 tools/check_strings.py --list

  # -------------------------------------------------------------------- 单测
  unit-test:
    name: 单测与打包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 ~/.gradle，二次构建从 6 分钟降到 1 分钟出头
      - name: 准备 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # runner 自带的 SDK 不一定有 platform 34；装一次是几秒钟的事，
      # 比构建到一半报 "failed to find target android-34" 好排查。
      - name: 确认 Android SDK 34
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: 跑单测并构建调试包
        run: |
          # 仓库里的 gradlew 权限位是 644（Windows 上勾不出 +x），这里补上
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      # 失败时最想知道「挂了几条、哪条」，上一步的日志里 grep 很费劲
      - name: 汇总用例数
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          total = failed = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
          print('单测 %d 条，失败 %d 条' % (total, failed))
          if total == 0:
              print('没有跑到任何用例，看看是不是 sourceSets 配错了')
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
