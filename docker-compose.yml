# 控制台常驻在 NAS / 常开的小主机上：电脑关机也能随时改片单。
#   cp .env.example .env      # 先填一个 16 位以上的强访问码
#   docker compose up -d --build
#   docker compose logs -f kidtv-console     # 看访问码和局域网链接
# 外网访问请看 README「外网也能改片单」：不要在路由器上把 8765 映射到公网。
services:
  kidtv-console:
    build:
      context: .
      dockerfile: tools/Dockerfile
    container_name: kidtv-console
    restart: unless-stopped
    ports:
      - "${KIDTV_PORT:-8765}:8765"
    environment:
      TZ: Asia/Shanghai
      KIDTV_CONFIG: /app/config/nas.local.json
      # 固定访问码：重建容器 / 换 NAS 后手机书签与外网登录仍然有效；留空则自动生成并打印在日志里
      KIDTV_TOKEN: "${KIDTV_TOKEN:-}"
      # 经 UGREENlink / Cloudflare Tunnel 等反向代理访问时设为 1，按真实客户端限速
      KIDTV_TRUST_PROXY: "${KIDTV_TRUST_PROXY:-0}"
    volumes:
      - kidtv-config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/desktop/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kidtv-config:
